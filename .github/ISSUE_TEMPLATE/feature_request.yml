name: 功能建议
description: 提议一个明确的使用场景或体验改进。
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: 感谢你的建议。请描述要解决的问题，不要附带 Apple 账号、验证码、私人照片或会话文件。
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 你在什么情况下遇到了什么不便？
      placeholder: 当我需要……时，目前……
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望应用如何工作？可以描述交互，不要求提供代码。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 目前是否有临时解决方法？此项可选。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issues，未发现相同建议。
          required: true
        - label: 此 Issue 不包含账号、验证码、会话或私人媒体。
          required: true
