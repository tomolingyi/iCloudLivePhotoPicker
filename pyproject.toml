[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "icloud-live-photo-picker"
version = "0.5.3"
description = "Windows desktop picker for iCloud photos and companion Live Photo videos"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "GPL-3.0-or-later"
authors = [{name = "iCloud Live Photo Picker contributors"}]
keywords = ["icloud", "live-photo", "photos", "pyqt6", "windows"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: Microsoft :: Windows :: Windows 10",
  "Operating System :: Microsoft :: Windows :: Windows 11",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Graphics :: Viewers",
]
dependencies = [
  "icloudpd @ https://files.pythonhosted.org/packages/b9/73/20544e68569fce262d596ebe42730aac235b8e69a36edefebdf8cfa85508/icloudpd-1.32.3-py3-none-any.whl",
  "PyQt6==6.10.2",
  "imageio-ffmpeg==0.6.0",
  "Pillow>=10.4,<12",
]

[project.gui-scripts]
icloud-live-picker = "icloud_live_picker.ui.qt_app:main"

[project.optional-dependencies]
build = ["PyInstaller==6.16.0"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["icloud_live_picker*"]

[tool.setuptools.package-data]
icloud_live_picker = ["assets/*.ico", "assets/*.png"]
